<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Официальная лицензия - Samsung Flash Drives</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1428a0 0%, #2c3e50 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        
        .license-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: #1428a0;
            color: white;
            padding: 30px;
            text-align: center;
            border-bottom: 5px solid #ffcc00;
        }
        
        .samsung-logo {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        
        .license-title {
            font-size: 1.8em;
            margin-bottom: 5px;
        }
        
        .content {
            padding: 40px;
        }
        
        .license-details {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            border-left: 4px solid #1428a0;
        }
        
        .detail-item {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        
        .detail-label {
            font-weight: bold;
            min-width: 200px;
            color: #1428a0;
        }
        
        .serial-section {
            background: #e3f2fd;
            padding: 20px;
            border-radius: 8px;
            margin: 25px 0;
        }
        
        .signature-area {
            margin-top: 40px;
            border-top: 2px dashed #ccc;
            padding-top: 20px;
        }
        
        .signature-line {
            display: flex;
            justify-content: space-between;
            margin-top: 60px;
        }
        
        .signature-box {
            text-align: center;
            width: 45%;
        }
        
        .stamp {
            color: #d32f2f;
            font-weight: bold;
            font-size: 1.1em;
            margin-top: 10px;
        }
        
        .valid-badge {
            background: #4caf50;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-block;
            margin: 20px 0;
            font-weight: bold;
        }
        
        .footer {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 0.9em;
        }
        
        @media (max-width: 600px) {
            .content {
                padding: 20px;
            }
            
            .detail-item {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .detail-label {
                min-width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="license-container">
        <div class="header">
            <div class="samsung-logo">SAMSUNG</div>
            <h1 class="license-title">ОФИЦИАЛЬНАЯ ЛИЦЕНЗИЯ НА ПРОДАЖУ</h1>
            <p>Флеш-накопители и SSD-диски</p>
        </div>
        
        <div class="content">
            <div class="valid-badge">ЛИЦЕНЗИЯ ДЕЙСТВИТЕЛЬНА</div>
            
            <div class="license-details">
                <div class="detail-item">
                    <span class="detail-label">Лицензиат:</span>
                    <span>Николас Алкапоне (Nicolas Alcapone)</span>
                </div>
                
                <div class="detail-item">
                    <span class="detail-label">Срок действия:</span>
                    <span>1 год с момента выдачи</span>
                </div>
                
                <div class="detail-item">
                    <span class="detail-label">Дата выдачи:</span>
                    <span id="issue-date"></span>
                </div>
                
                <div class="detail-item">
                    <span class="detail-label">Дата истечения:</span>
                    <span id="expiry-date"></span>
                </div>
                
                <div class="detail-item">
                    <span class="detail-label">Тип лицензии:</span>
                    <span>Эксклюзивная дистрибьюция</span>
                </div>
            </div>
            
            <div class="serial-section">
                <h3>🔒 ЗАЩИТА СЕРИЙНЫМИ НОМЕРАМИ</h3>
                <p>Все товары защищены уникальными серийными кодами, которые обеспечивают:</p>
                <ul style="margin: 10px 0 10px 20px;">
                    <li>Подлинность продукции Samsung</li>
                    <li>Официальную гарантию производителя</li>
                    <li>Возможность проверки легальности поставки</li>
                    <li>Техническую поддержку и обслуживание</li>
                </ul>
            </div>
            
            <h3>РАЗРЕШЕННЫЕ ВИДЫ ДЕЯТЕЛЬНОСТИ:</h3>
            <ul style="margin: 15px 0 15px 20px;">
                <li>Официальные розничные продажи флеш-накопителей Samsung</li>
                <li>Оптовые поставки авторизованным дилерам</li>
                <li>Продажи через интернет-платформы и маркетплейсы</li>
                <li>Корпоративные поставки и тендеры</li>
            </ul>
            
            <div class="signature-area">
                <div class="signature-line">
                    <div class="signature-box">
                        <p>_________________________</p>
                        <p>Подпись лицензиата</p>
                        <p>Николас Алкапоне</p>
                    </div>
                    
                    <div class="signature-box">
                        <p>_________________________</p>
                        <p>Подпись представителя Samsung</p>
                        <div class="stamp">ОФИЦИАЛЬНАЯ ПЕЧАТЬ</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>Samsung Electronics Co., Ltd. | Официальная лицензия № SL-2024-NCA-8812</p>
            <p>Все права защищены. Подделка лицензии преследуется по закону.</p>
        </div>
    </div>

    <script>
        // Установка дат
        const issueDate = new Date();
        const expiryDate = new Date();
        expiryDate.setFullYear(issueDate.getFullYear() + 1);
        
        document.getElementById('issue-date').textContent = issueDate.toLocaleDateString('ru-RU');
        document.getElementById('expiry-date').textContent = expiryDate.toLocaleDateString('ru-RU');
        
        // Автоматическое обновление статуса
        function updateLicenseStatus() {
            const now = new Date();
            const validBadge = document.querySelector('.valid-badge');
            
            if (now > expiryDate) {
                validBadge.textContent = 'ЛИЦЕНЗИЯ ИСТЕКЛА';
                validBadge.style.background = '#f44336';
            }
        }
        
        updateLicenseStatus();
    </script>
</body>
</html>
